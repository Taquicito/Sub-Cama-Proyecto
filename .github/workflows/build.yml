name: Compilar EBOOT para PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con pspdev (Docker)
        run: docker run --rm -v "$PWD":/src -w /src pspdev/pspdev make

      - name: Subir EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: SubCama-EBOOT
          path: |
            EBOOT.PBP
            PARAM.SFO
